name: Release

# Push a tag like v1.0.1 (matching the version in Cargo.toml) to build static
# binaries and publish them as a GitHub release. workflow_dispatch only builds
# the artifacts, which is handy for testing the workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Each leg builds natively (x86_64 on x86_64, aarch64 on arm), so the
    # musl-gcc wrapper from musl-tools is a compiler for the right target.
    # Without it ring's build script cannot find a C compiler and fails with
    # "failed to find tool \"aarch64-linux-musl-gcc\"".
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      AR_x86_64_unknown_linux_musl: ar
      CC_aarch64_unknown_linux_musl: musl-gcc
      AR_aarch64_unknown_linux_musl: ar
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static binaries (musl, static-pie) that run on any Linux
          # distribution, old or new, glibc or musl.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version | head -n1

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi

          # A release tag must agree with the crate version, otherwise assets
          # would be mislabelled.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag $tag does not match Cargo.toml version $version" >&2
              exit 1
            fi
          fi

          name="suno-downloader-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/suno-downloader" "dist/$name/"
          cp README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: suno-downloader-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256
          ls -l

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Statically linked Linux binaries (musl, static-pie) — no glibc version
          requirements, so they run on any distribution.

          - `x86_64-unknown-linux-musl` — most desktops and servers
          - `aarch64-unknown-linux-musl` — ARM64 machines, Raspberry Pi 4/5 (64-bit)

          Each tarball contains the `suno-downloader` binary and this README.
          Verify with `sha256sum --check <file>.sha256`.

          Requirements: **ffmpeg** on `PATH` (for MP3 encoding).

          ```bash
          tar -xzf suno-downloader-*-x86_64-unknown-linux-musl.tar.gz
          sudo install suno-downloader-*/suno-downloader /usr/local/bin/
          suno-downloader https://suno.com/song/<id>
          ```
          EOF

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "suno-downloader ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md
          fi
