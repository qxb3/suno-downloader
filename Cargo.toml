[package]
name = "suno-downloader"
version = "1.0.0"
edition = "2021"
description = "Download a public Suno song as an MP3 from a suno.com link"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
ctr = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
